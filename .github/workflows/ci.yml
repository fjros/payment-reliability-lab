name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. This workflow builds and tests; it never deploys or publishes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs (checked with `git ls-remote` on 2026-09-17). Re-verify
      # each SHA against the upstream tag named in the trailing comment before bumping it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      # Real PostgreSQL through Testcontainers (Docker is available on GitHub-hosted Ubuntu runners).
      - run: npm run test:integration
      - run: npm run test:mcp
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
