# Local demo PostgreSQL only. Bound to loopback; the password is a local-demo default, not a secret.
# Tests do NOT use this: they start their own throwaway container through Testcontainers.
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PRL_PG_ADMIN_PASSWORD:-local-demo-admin}
    ports:
      - '127.0.0.1:${PRL_PG_PORT:-54329}:5432'
    volumes:
      - prl_demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  prl_demo_pgdata:
